<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 520" width="1200" height="520" font-family="Helvetica, Arial, sans-serif">
  <title>Isolate genome pipeline: metro map</title>
  <defs>
    <g id="file">
      <path d="M0,0 h20 l10,10 v30 h-30 z" fill="#fff" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M20,0 v10 h10" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1200" height="520" fill="#fff"/>

  <text x="40" y="48" font-size="24" font-weight="700" fill="#222">bbr_genomes isolate pipeline</text>
  <text x="40" y="72" font-size="14" fill="#555">One Slurm job per genome per step · GTDB-Tk runs in batches</text>

  <!-- Lines: shared trunk (input → fastp → SPAdes → filter), then one branch per analysis -->
  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82,226 H620 L756,90 H980"  stroke="#E69F00"/>
    <path d="M82,238 H620 L658,200 H980" stroke="#009E73"/>
    <path d="M82,250 H620 L670,300 H980" stroke="#0072B2"/>
    <path d="M82,262 H620 L768,410 H980" stroke="#CC79A7"/>
  </g>

  <!-- Input -->
  <use xlink:href="#file" x="42" y="224"/>
  <text x="57" y="290" font-size="13" fill="#222" text-anchor="middle">paired</text>
  <text x="57" y="306" font-size="13" fill="#222" text-anchor="middle">FASTQ</text>

  <!-- Trunk stations -->
  <g fill="#fff" stroke="#222" stroke-width="3">
    <rect x="246" y="214" width="28" height="60" rx="14"/>
    <rect x="406" y="214" width="28" height="60" rx="14"/>
    <rect x="546" y="214" width="28" height="60" rx="14"/>
  </g>
  <g font-size="15" font-weight="700" fill="#222" text-anchor="middle">
    <text x="260" y="202">fastp</text>
    <text x="420" y="202">SPAdes 4.0.0</text>
    <text x="560" y="202">Filter</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="260" y="294">adapter &amp; quality</text>
    <text x="260" y="309">trimming</text>
    <text x="420" y="294">--isolate</text>
    <text x="420" y="309">assembly</text>
    <text x="560" y="294">drop contigs</text>
    <text x="560" y="309">&lt; 500 bp</text>
  </g>

  <!-- Branch stations -->
  <g fill="#fff" stroke="#222" stroke-width="3">
    <circle cx="860" cy="90"  r="11"/>
    <circle cx="860" cy="200" r="11"/>
    <circle cx="860" cy="300" r="11"/>
    <circle cx="860" cy="410" r="11"/>
  </g>
  <g font-size="15" font-weight="700" fill="#222" text-anchor="middle">
    <text x="860" y="68">QUAST 5.2.0</text>
    <text x="860" y="178">CheckM2 1.1.0</text>
    <text x="860" y="278">Bakta</text>
    <text x="860" y="388">GTDB-Tk 2.8.0</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="860" y="120">assembly stats</text>
    <text x="860" y="230">completeness / contamination</text>
    <text x="860" y="330">annotation (DB v6.0)</text>
    <text x="860" y="440">batches of 100 genomes</text>
  </g>

  <!-- Outputs -->
  <use xlink:href="#file" x="985" y="70"/>
  <use xlink:href="#file" x="985" y="180"/>
  <use xlink:href="#file" x="985" y="280"/>
  <use xlink:href="#file" x="985" y="390"/>
  <g font-size="13" fill="#222">
    <text x="1028" y="88">quast_summary.tsv</text>
    <text x="1028" y="198">checkm2_summary.tsv</text>
    <text x="1028" y="298">GFF3 · GBFF · FAA</text>
    <text x="1028" y="408">gtdbtk_summary.tsv</text>
  </g>
  <g font-size="11" fill="#777">
    <text x="1028" y="103">results/summary/</text>
    <text x="1028" y="213">results/summary/</text>
    <text x="1028" y="313">results/&lt;sample&gt;/bakta/</text>
    <text x="1028" y="423">results/summary/</text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#222">
    <line x1="40"  y1="482" x2="72"  y2="482" stroke="#E69F00" stroke-width="8" stroke-linecap="round"/>
    <text x="82"  y="487">Assembly QC</text>
    <line x1="210" y1="482" x2="242" y2="482" stroke="#009E73" stroke-width="8" stroke-linecap="round"/>
    <text x="252" y="487">Genome quality</text>
    <line x1="390" y1="482" x2="422" y2="482" stroke="#0072B2" stroke-width="8" stroke-linecap="round"/>
    <text x="432" y="487">Annotation</text>
    <line x1="550" y1="482" x2="582" y2="482" stroke="#CC79A7" stroke-width="8" stroke-linecap="round"/>
    <text x="592" y="487">Taxonomy</text>
  </g>
</svg>
